name: Release installer

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      version:
        description: Installer version from package.json.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: engine-publication
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Release installer and refresh Pages for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { api } = require('./scripts/github.cjs');
          const { assert, failure } = require('./lib/common.cjs');
          (async () => {
            const version = require('./package.json').version;
            const base = '/repos/DragonWork/install-action';
            const existing = await api(`${base}/releases/tags/v${version}`, { optional: true });
            const result = spawnSync(process.execPath, ['scripts/release-engine.cjs'], { stdio: 'inherit' });
            assert(result.status === 0, 'Installer release failed.');
            if (!existing) await api(`${base}/actions/workflows/pages.yml/dispatches`, {
              method: 'POST', body: { ref: 'main' },
            });
          })().catch(failure);
          NODE
