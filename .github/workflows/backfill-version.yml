name: Backfill crate version

on:
  workflow_dispatch:
    inputs:
      crate:
        description: CLI crate name (no minimum download count).
        type: string
        required: true
      version:
        description: Exact stable version; adds it to the catalog if newer than the listed version.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: crate-updates
  queue: max
  cancel-in-progress: false

env:
  CRATE_NAME: ${{ inputs.crate }}
  CRATE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      platforms: ${{ steps.prepare.outputs.platforms }}
      work: ${{ steps.prepare.outputs.work }}
      publish: ${{ steps.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/backfill-version.cjs prepare
      - if: steps.prepare.outputs.publish == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backfill-version
          path: registry
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  validate:
    needs: prepare
    if: needs.prepare.outputs.work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/smoke.cjs

  publish:
    concurrency:
      group: crate-publication
      queue: max
    needs: [prepare, validate]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'true' && (needs.validate.result == 'success' || (needs.prepare.outputs.work == 'false' && needs.validate.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry
          merge-multiple: true
      - name: Publish and register version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/backfill-version.cjs publish
