name: Backfill crate version

on:
  workflow_dispatch:
    inputs:
      crate:
        description: CLI crate name.
        type: string
        required: true
      version:
        description: Exact stable crate version.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: crate-publication
  cancel-in-progress: false

env:
  CRATE_NAME: ${{ inputs.crate }}
  CRATE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      platforms: ${{ steps.prepare.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - id: prepare
        run: node scripts/backfill-version.cjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backfill-version
          path: registry
          retention-days: 3
          if-no-files-found: error

  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/smoke.cjs

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/backfill-version.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
