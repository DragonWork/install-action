name: Update crates

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:
    inputs:
      crates:
        description: CLI crates to add or update regardless of download count (space-separated).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crate-updates
  queue: max
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      head: ${{ steps.base.outputs.head }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      work: ${{ steps.update.outputs.work }}
      matrix: ${{ steps.update.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/init-registry.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: crates.io
          path: registry
          persist-credentials: false
      - id: base
        shell: bash
        run: echo "head=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Identify crates.io snapshot
        if: inputs.crates == ''
        id: inventory
        continue-on-error: true
        run: python3 -B scripts/discover-crates.py --cache-info
      - id: cache
        if: inputs.crates == '' && steps.inventory.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: registry/catalog.json
          key: ${{ steps.inventory.outputs.key }}
          lookup-only: ${{ steps.inventory.outputs.restore != 'true' }}
      - name: Discover CLI crates
        if: inputs.crates == '' || hashFiles('registry/catalog.json') == ''
        id: discover
        run: python3 -B scripts/discover-crates.py
      - if: steps.discover.outputs.key != '' && (steps.cache.outputs.cache-hit != 'true' || steps.inventory.outputs.key != steps.discover.outputs.key)
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: registry/catalog.json
          key: ${{ steps.discover.outputs.key }}
      - name: Resolve crate updates
        id: update
        env:
          CRATE_NAMES: ${{ inputs.crates }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-tools.cjs plan
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-plan
          path: |
            registry/catalog.json
            registry/catalog-state.json
            registry/update-plan.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  prepare:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/update-tools.cjs prepare
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-${{ needs.plan.outputs.artifact }}-${{ matrix.shard }}
          path: prepared
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  merge:
    needs: [plan, prepare]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.prepare.result == 'success' || (needs.plan.outputs.work == 'false' && needs.prepare.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.merge.outputs.changed }}
      names: ${{ steps.merge.outputs.names }}
      incomplete: ${{ steps.merge.outputs.incomplete }}
      platforms: ${{ steps.merge.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: registry
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: registry
          merge-multiple: true
      - if: needs.plan.outputs.work == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prepared-${{ needs.plan.outputs.artifact }}-*
          path: prepared
          merge-multiple: true
      - id: merge
        run: node scripts/update-tools.cjs merge
      - name: Stage catalog metadata with the changed tools
        env:
          CHANGED_CRATES: ${{ steps.merge.outputs.names }}
        run: |
          mkdir -p publication/tools
          cp registry/catalog{,-state,-progress}.json publication/
          for crate in $CHANGED_CRATES; do
            cp -R "registry/tools/$crate" publication/tools/
          done
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-manifests
          path: publication
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  validate:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: ${{ fromJSON(needs.merge.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.merge.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/smoke.cjs
        env:
          CHANGED_CRATES: ${{ needs.merge.outputs.names }}

  publish:
    concurrency:
      group: crate-publication
      queue: max
    needs: [plan, merge, validate]
    if: ${{ !cancelled() && needs.merge.result == 'success' && (needs.validate.result == 'success' || (needs.merge.outputs.changed == 'false' && needs.validate.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          path: registry
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.merge.outputs.artifact }}
          path: registry
          merge-multiple: true
      - name: Publish validated tools
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_HEAD: ${{ needs.plan.outputs.head }}
          CHANGED_CRATES: ${{ needs.merge.outputs.names }}
        run: node scripts/publish-tools.cjs
      - name: Report incomplete requests
        if: needs.merge.outputs.incomplete != ''
        env:
          INCOMPLETE: ${{ needs.merge.outputs.incomplete }}
        run: |
          echo "::error::Could not prepare $INCOMPLETE. See the batch summary."
          exit 1
