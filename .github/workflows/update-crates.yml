name: Update crates

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:
    inputs:
      crates:
        description: Additional CLI crates to register (space-separated).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crate-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.base.outputs.head }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.update.outputs.changed }}
      names: ${{ steps.update.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: crates
          path: registry
          persist-credentials: false
      - id: base
        shell: bash
        run: echo "head=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - name: Resolve crate updates
        id: update
        run: node scripts/update-tools.cjs
        env:
          CRATE_NAMES: ${{ inputs.crates }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-manifests
          path: registry/tools
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry/tools
          merge-multiple: true
      - run: npm run check
      - run: node scripts/smoke.cjs
        env:
          CHANGED_CRATES: ${{ needs.prepare.outputs.names }}
          PREBUILT_ONLY: 'true'

  publish:
    needs: [prepare, validate]
    if: always() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry/tools
          merge-multiple: true
      - name: Publish signed crate commits and tags
        run: node scripts/publish-tools.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_HEAD: ${{ needs.prepare.outputs.head }}
