name: Update crates

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:
    inputs:
      crates:
        description: CLI crates to prioritize (space-separated).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crate-publication
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/init-registry.cjs
        env:
          GH_TOKEN: ${{ github.token }}

  plan:
    needs: initialize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      head: ${{ steps.base.outputs.head }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      work: ${{ steps.update.outputs.work }}
      matrix: ${{ steps.update.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: crates.io
          path: registry
          persist-credentials: false
      - id: base
        shell: bash
        run: echo "head=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: python3 -B -m unittest discover -s test -p '*_test.py'
      - name: Identify crates.io snapshot
        id: inventory
        run: python3 -B scripts/discover-crates.py --cache-info
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: registry/catalog.json
          key: ${{ steps.inventory.outputs.key }}
          lookup-only: ${{ steps.inventory.outputs.restore != 'true' }}
      - name: Discover CLI crates
        id: discover
        run: python3 -B scripts/discover-crates.py
      - if: steps.cache.outputs.cache-hit != 'true' || steps.inventory.outputs.key != steps.discover.outputs.key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: registry/catalog.json
          key: ${{ steps.discover.outputs.key }}
      - name: Resolve crate updates
        id: update
        run: node scripts/update-tools.cjs plan
        env:
          CRATE_NAMES: ${{ inputs.crates }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-plan
          path: |
            registry/tools
            registry/catalog.json
            registry/catalog-state.json
            registry/update-plan.json
          if-no-files-found: error
          retention-days: 3

  prepare:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/update-tools.cjs prepare
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-${{ matrix.shard }}
          path: prepared
          if-no-files-found: error
          retention-days: 3

  merge:
    needs: [plan, prepare]
    if: always() && needs.plan.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-26.04
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.merge.outputs.changed }}
      names: ${{ steps.merge.outputs.names }}
      remaining: ${{ steps.merge.outputs.remaining }}
      platforms: ${{ steps.merge.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: registry
          merge-multiple: true
      - if: needs.plan.outputs.work == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prepared-*
          path: prepared
          merge-multiple: true
      - id: merge
        run: node scripts/update-tools.cjs merge
      - run: npm run check
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-manifests
          path: |
            registry/tools
            registry/catalog.json
            registry/catalog-state.json
            registry/catalog-progress.json
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: merge
    if: needs.merge.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.merge.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.merge.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: npm run check
      - run: node scripts/smoke.cjs
        env:
          CHANGED_CRATES: ${{ needs.merge.outputs.names }}

  publish:
    needs: [plan, merge, validate]
    if: always() && needs.merge.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.merge.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: node scripts/publish-tools.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_HEAD: ${{ needs.plan.outputs.head }}
          CHANGED_CRATES: ${{ needs.merge.outputs.names }}

  continue:
    needs: [merge, publish]
    if: always() && needs.publish.result == 'success' && needs.merge.outputs.remaining != '0'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/continue-catalog.cjs
        env:
          GH_TOKEN: ${{ github.token }}
