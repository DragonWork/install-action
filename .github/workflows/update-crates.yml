name: Update crates

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:
    inputs:
      crates:
        description: CLI crates to prioritize (space-separated).
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crate-publication
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/init-registry.cjs
        env:
          GH_TOKEN: ${{ github.token }}

  prepare:
    needs: initialize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.base.outputs.head }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
      changed: ${{ steps.update.outputs.changed }}
      names: ${{ steps.update.outputs.names }}
      remaining: ${{ steps.update.outputs.remaining }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: crates.io
          path: registry
          persist-credentials: false
      - id: base
        shell: bash
        run: echo "head=$(git -C registry rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm test
      - run: python3 -B -m unittest discover -s test -p '*_test.py'
      - name: Discover CLI crates
        run: python3 -B scripts/discover-crates.py
      - name: Resolve crate updates
        id: update
        run: node scripts/update-tools.cjs
        env:
          CRATE_NAMES: ${{ inputs.crates }}
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-manifests
          path: |
            registry/tools
            registry/catalog.json
            registry/catalog-state.json
            registry/catalog-progress.json
          if-no-files-found: error
          retention-days: 3

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry
          merge-multiple: true
      - run: npm run check
      - run: node scripts/smoke.cjs
        env:
          CHANGED_CRATES: ${{ needs.prepare.outputs.names }}

  continue:
    needs: [prepare, publish]
    if: always() && needs.publish.result == 'success' && needs.prepare.outputs.remaining != '0'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/continue-catalog.cjs
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [prepare, validate]
    if: always() && needs.prepare.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact }}
          path: registry
          merge-multiple: true
      - name: Publish signed crate commits and tags
        run: node scripts/publish-tools.cjs
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_HEAD: ${{ needs.prepare.outputs.head }}
          CHANGED_CRATES: ${{ needs.prepare.outputs.names }}
