name: Pinned installation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-26.04
    steps:
      - uses: DragonWork/install-action@febef948677370a825a0c9bf206949bf8d6f3897 # v1.2.0
      - id: cliff
        uses: DragonWork/install-action/tools/git-cliff@7b03d4b6428472552f85b3df46fa8c175b8337fa # git-cliff/v2.14.2
      - run: test "$(git-cliff --version)" = "git-cliff $EXPECTED_VERSION"
        env:
          EXPECTED_VERSION: ${{ steps.cliff.outputs.version }}

  dinghy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: DragonWork/install-action@febef948677370a825a0c9bf206949bf8d6f3897 # v1.2.0
      - id: dinghy
        uses: DragonWork/install-action/tools/cargo-dinghy@8976fca7e98645a390bc74859e17de8309700083 # cargo-dinghy/v0.8.6
      - shell: bash
        run: |
          version="$(cargo dinghy --version)"
          printf '%s\n' "$version"
          test "${version##* }" = "$EXPECTED_VERSION"
        env:
          EXPECTED_VERSION: ${{ steps.dinghy.outputs.version }}
